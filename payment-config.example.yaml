payment:
  routes:
    - method: GET
      path: /paid/hello
      handler: paid_hello
      description: Paid hello resource
      accepts:
        - scheme: exact
          network: eip155:84532
          # Example token address on Base Sepolia (replace with your actual token).
          asset: 0x036CbD53842c5426634e7929541eC2318f3dCF7e
          amount: "10000"
          payTo: 0x1111111111111111111111111111111111111111
          maxTimeoutSeconds: 300
        - scheme: exact
          network: eip155:47763
          # Example xGAS-style option on Neo X (replace with your actual xGAS token address).
          asset: 0x2222222222222222222222222222222222222222
          amount: "1000000000000000000"
          payTo: 0x1111111111111111111111111111111111111111
          maxTimeoutSeconds: 300
          extra:
            name: xGAS
            version: "1"
            assetTransferMethod: eip3009

    - method: POST
      path: /paid/echo
      handler: paid_echo
      description: Paid echo resource
      accepts:
        - scheme: exact
          network: eip155:84532
          asset: 0x036CbD53842c5426634e7929541eC2318f3dCF7e
          amount: "5000"
          payTo: 0x1111111111111111111111111111111111111111
          maxTimeoutSeconds: 300
