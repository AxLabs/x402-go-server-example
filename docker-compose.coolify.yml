# Coolify: facilitator + server on the same host (separate Coolify apps).
# Set "Docker Compose Location" to ./docker-compose.coolify.yml
#
# Required env:
#   FACILITATOR_DOCKER_NETWORK=hg20xignraizz6za0lx0ydja  (facilitator app network; stable UUID)
#   FACILITATOR_BASE_URL=http://facilitator:8080
#
# For local dev or single-machine compose without shared network, use docker-compose.yml instead.

services:
  server:
    build: .
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      READ_TIMEOUT: ${READ_TIMEOUT:-120s}
      WRITE_TIMEOUT: ${WRITE_TIMEOUT:-120s}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-120s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-30s}
      FACILITATOR_BASE_URL: ${FACILITATOR_BASE_URL:?FACILITATOR_BASE_URL is required}
      FACILITATOR_TIMEOUT: ${FACILITATOR_TIMEOUT:-120s}
      PAYMENT_CONFIG_FILE: ${PAYMENT_CONFIG_FILE:-/app/payment-config.yaml}
    ports:
      - "${SERVER_HOST_PORT:-8080}:8080"
    networks:
      - default
      - facilitator

networks:
  default:
  facilitator:
    external: true
    name: ${FACILITATOR_DOCKER_NETWORK:?set FACILITATOR_DOCKER_NETWORK to the facilitator Docker network}
