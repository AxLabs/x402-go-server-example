payment:
  routes:
    - method: GET
      path: /paid/hello
      handler: paid_hello
      description: Paid hello resource (Neo X Testnet profile)
      accepts:
        - scheme: exact
          network: eip155:47763
          asset: 0xd2a4CfF31913016155e38113C7d8e7F4FC7E63DE
          amount: "1000000000000000000"
          payTo: 0x1111111111111111111111111111111111111111
          maxTimeoutSeconds: 300
          extra:
            name: xGAS
            version: "1"
            assetTransferMethod: eip3009

    - method: POST
      path: /paid/echo
      handler: paid_echo
      description: Paid echo resource (Neo X Testnet profile)
      accepts:
        - scheme: exact
          network: eip155:47763
          asset: 0xd2a4CfF31913016155e38113C7d8e7F4FC7E63DE
          amount: "500000000000000000"
          payTo: 0x1111111111111111111111111111111111111111
          maxTimeoutSeconds: 300
          extra:
            name: xGAS
            version: "1"
            assetTransferMethod: eip3009
